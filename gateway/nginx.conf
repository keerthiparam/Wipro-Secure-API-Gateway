
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;

    # =====================================
    # RATE LIMITING
    # 5 requests/second per client IP
    # Additional burst allowance: 10
    # =====================================

    limit_req_zone $binary_remote_addr
        zone=api_limit:10m
        rate=5r/s;

    # =====================================
    # NGINX ACCESS LOGGING
    # =====================================

    log_format nms_main
        '$time_iso8601 | '
        'IP=$remote_addr | '
        'METHOD=$request_method | '
        'URI=$request_uri | '
        'STATUS=$status | '
        'BYTES=$body_bytes_sent | '
        'TIME=$request_time | '
        'UPSTREAM=$upstream_status';

    server {
        listen 8080;
        server_name localhost;

        access_log logs/nms_access.log nms_main;

        # =====================================
        # INTERNAL JWT VALIDATION
        # =====================================

        location = /_auth {
            internal;

            proxy_pass http://127.0.0.1:5000/internal/validate;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Authorization $http_authorization;
        }

        # =====================================
        # PUBLIC HEALTH CHECK
        # No JWT required
        # No rate limiting
        # =====================================

        location = /api/health {
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # =====================================
        # PROTECTED NMS API ENDPOINTS
        # JWT authentication + rate limiting
        # =====================================

        location /api/ {
            # Validate JWT through Flask
            auth_request /_auth;

            # Apply rate limiting
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            # Forward requests to Flask
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # =====================================
        # BLOCK DIRECT ACCESS TO INTERNAL API
        # =====================================

        location ^~ /internal/ {
            return 404;
        }

        # =====================================
        # OAUTH TOKEN ENDPOINT
        # =====================================

        location / {
            proxy_pass http://127.0.0.1:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
